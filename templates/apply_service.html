{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card-gov">
            <div class="card-header-gov d-flex justify-content-between align-items-center">
                <span>Application Form: {{ service['service_name'] }}</span>
                <span class="badge bg-secondary font-monospace" style="font-size: 0.75rem;">FEE: ₹{{ service['processing_fee'] }}</span>
            </div>
            <div class="p-4 bg-white">
                <p class="text-muted small mb-4 pb-2 border-bottom">{{ service['description'] }}</p>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Father / Guardian Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="father_name" class="form-control rounded-1" required placeholder="Enter full name as per legal records">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Permanent Residential Address <span class="text-danger">*</span></label>
                        <textarea name="address" class="form-control rounded-1" rows="3" required placeholder="Complete address including PIN code"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Annual Family Income (INR) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="declared_income" class="form-control rounded-1" required placeholder="e.g. 240000">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Supporting Document (Identity / Residence Proof) <span class="text-danger">*</span></label>
                        <input type="file" name="document" class="form-control rounded-1" accept=".pdf,.png,.jpg,.jpeg" required>
                        <div class="form-text small">Accepted formats: PDF, PNG, JPG (Maximum size: 5MB)</div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('citizen_dashboard') }}" class="btn btn-outline-secondary btn-sm px-3 rounded-1">
                            Cancel & Return
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm px-4 rounded-1" style="background-color: var(--gov-blue); border-color: var(--gov-blue);">
                            Submit Application
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
